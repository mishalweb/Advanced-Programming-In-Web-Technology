services:
  postgres:
    image: postgres:17-alpine
    container_name: product-inventory-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: product_inventory_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d product_inventory_db"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
